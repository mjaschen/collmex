name: Collmex PHP SDK Tests

on:
    push:
        branches:
            - main
    pull_request:
        branches:
            - main

jobs:
    build:
        runs-on: ubuntu-latest

        strategy:
            matrix:
                php-version:
                    - "8.1"
                    - "8.2"
                    - "8.3"
                    - "8.4"
                    - "8.5"
                composer-dependencies:
                    - ""
                    - "--prefer-lowest"

        name: "collmex-php-sdk build - PHP ${{ matrix.php-version }} - Composer ${{ matrix.composer-dependencies }}"

        steps:
            -   uses: actions/checkout@v7

            -   name: Setup PHP
                if: ${{ env.GITEA_ACTIONS != 'true' }}
                uses: shivammathur/setup-php@v2
                with:
                    php-version: ${{ matrix.php-version }}
                    ini-file: development
                    coverage: xdebug
                    tools: pecl
                    extensions: curl,fileinfo,zip,bcmath

            -   name: Setup PHP (self-hosted)
                if: ${{ env.GITEA_ACTIONS == 'true' }}
                uses: shivammathur/setup-php@v2
                with:
                    php-version: ${{ matrix.php-version }}
                    ini-file: development
                    coverage: xdebug
                    tools: pecl
                    extensions: curl,fileinfo,zip,bcmath
                env:
                    runner: self-hosted

            -   name: Validate composer.json and composer.lock
                run: composer validate

            -   name: Get Composer cache directory
                id: composer-cache-dir
                run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

            -   name: Cache Composer downloads
                uses: actions/cache@v6
                with:
                    path: ${{ steps.composer-cache-dir.outputs.dir }}
                    key: ${{ runner.os }}-composer-cache-${{ matrix.php-version }}-${{ matrix.composer-dependencies }}-${{ hashFiles('composer.json', 'composer.lock') }}
                    restore-keys: |
                        ${{ runner.os }}-composer-cache-${{ matrix.php-version }}-${{ matrix.composer-dependencies }}-
                        ${{ runner.os }}-composer-cache-${{ matrix.php-version }}-
                        ${{ runner.os }}-composer-cache-

            -   name: Install dependencies
                run: composer update --no-progress --prefer-stable --prefer-dist ${{ matrix.composer-dependencies }}

            -   name: Lint PHP Sources
                run: composer run-script ci:lint

            -   name: PHP Code Sniffer
                run: composer run-script ci:sniff

            -   name: Static Analysis
                run: composer run-script ci:phpstan

            -   name: Unit Tests
                run: composer run-script ci:tests
